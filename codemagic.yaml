workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60

    environment:
      vars:
        PACKAGE_NAME: "com.hazoora.quizgame"

    scripts:
      - chmod +x gradlew
      - ./gradlew assembleRelease
      - ./gradlew bundleRelease

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
